<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>2026 행복다드림 수학여행</title>
<meta name="theme-color" content="#2B6CB8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="행복다드림">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    --blue:#2B6CB8;
    --blue-dark:#1E4D80;
    --blue-pale:#EAF2FC;
    --yellow:#FFB100;
    --yellow-pale:#FFF4DC;
    --coral:#E8543C;
    --coral-pale:#FDE9E5;
    --green:#3FA873;
    --green-pale:#E6F6EE;
    --bg:#F5F8FC;
    --card:#FFFFFF;
    --text:#1F2937;
    --text-soft:#697386;
    --text-faint:#9AA5B4;
    --border:#E4EAF2;
    --radius:18px;
    --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overflow-x:hidden;width:100%;}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Top bar ---------- */
  .topbar{
    background:linear-gradient(135deg,var(--blue) 0%, var(--blue-dark) 100%);
    color:#fff;
    padding:calc(env(safe-area-inset-top) + 16px) 20px 22px;
    border-radius:0 0 26px 26px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute; right:-30px; top:-30px;
    width:140px;height:140px;border-radius:50%;
    background:rgba(255,255,255,0.08);
  }
  .topbar .eyebrow{font-size:13px;opacity:0.85;font-weight:600;letter-spacing:0.02em;}
  .topbar h1{font-size:21px;margin:4px 0 14px;font-weight:800;letter-spacing:-0.01em;}
  .day-chip{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.25);
    padding:8px 14px;border-radius:999px;font-size:14px;font-weight:700;
  }
  .day-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);}

  /* ---------- Layout ---------- */
  .view{padding:16px 16px 8px;max-width:520px;margin:0 auto;animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .section-title{font-size:15px;font-weight:800;margin:22px 2px 10px;display:flex;align-items:center;gap:6px;}
  .section-title:first-child{margin-top:4px;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }

  /* ---------- Home: priority stack ---------- */
  .notice-banner{
    background:var(--coral-pale);
    border:1px solid #F5C6BC;
    border-radius:var(--radius);
    padding:14px 16px;
    margin-top:-30px;
    position:relative;
    z-index:2;
  }
  .notice-banner .tag{
    display:inline-block;background:var(--coral);color:#fff;font-size:11px;font-weight:800;
    padding:3px 8px;border-radius:999px;margin-bottom:6px;
  }
  .notice-banner .msg{font-size:14.5px;font-weight:700;color:#8A2E1D;}

  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .quick-card{
    background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:14px;display:flex;flex-direction:column;gap:4px;min-height:78px;justify-content:center;
  }
  .quick-card .label{font-size:12px;color:var(--text-soft);font-weight:600;}
  .quick-card .value{font-size:15px;font-weight:800;}

  .next-card{
    background:var(--blue-pale);border:1px solid #C9DFF7;border-radius:var(--radius);
    padding:16px;display:flex;align-items:center;gap:14px;
  }
  .next-card .time{
    background:var(--blue);color:#fff;font-weight:800;font-size:15px;
    padding:10px 12px;border-radius:12px;min-width:64px;text-align:center;
  }
  .next-card .info .t{font-weight:800;font-size:15.5px;}
  .next-card .info .p{font-size:13px;color:var(--text-soft);margin-top:2px;}

  .mission-cta{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:linear-gradient(135deg,var(--yellow) 0%, #FFC94D 100%);
    border-radius:var(--radius);padding:16px;color:#5A3A00;
  }
  .mission-cta .t{font-weight:800;font-size:15px;}
  .mission-cta .s{font-size:12.5px;opacity:0.85;margin-top:2px;}
  .btn-go{
    background:#5A3A00;color:#fff;font-weight:800;font-size:13px;
    padding:10px 16px;border-radius:12px;border:none;white-space:nowrap;
  }

  .btn-primary{
    display:block;width:100%;text-align:center;background:var(--blue);color:#fff;
    font-weight:800;font-size:15.5px;padding:15px;border-radius:14px;border:none;
    min-height:48px;
  }
  .btn-primary:active{background:var(--blue-dark);}
  .btn-outline{
    display:block;width:100%;text-align:center;background:#fff;color:var(--blue);
    font-weight:700;font-size:14.5px;padding:13px;border-radius:14px;border:1.5px solid var(--blue);
    min-height:44px;margin-top:8px;
  }

  /* ---------- Timeline (signature element) ---------- */
  .timeline{position:relative;padding-left:28px;margin-top:6px;}
  .timeline::before{
    content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;
    background:linear-gradient(var(--border),var(--border));border-radius:3px;
  }
  .t-item{position:relative;padding:0 0 22px 14px;}
  .t-item:last-child{padding-bottom:2px;}
  .t-item::before{
    content:"";position:absolute;left:-23px;top:3px;width:14px;height:14px;border-radius:50%;
    background:#fff;border:3px solid var(--text-faint);
  }
  .t-item.done::before{border-color:var(--green);background:var(--green);}
  .t-item.now::before{border-color:var(--yellow);background:var(--yellow);box-shadow:0 0 0 5px var(--yellow-pale);}
  .t-item .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .t-item .time{font-size:12.5px;font-weight:800;color:var(--text-soft);}
  .t-item.now .time{color:#8A6300;}
  .t-item .title{font-size:15px;font-weight:800;margin-top:2px;}
  .t-item .meta{font-size:12.5px;color:var(--text-soft);margin-top:3px;}
  .t-item .note{font-size:12.5px;color:var(--text-faint);margin-top:4px;}
  .badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;}
  .badge.now{background:var(--yellow-pale);color:#8A6300;}
  .badge.done{background:var(--green-pale);color:#1E7A4C;}
  .badge.next{background:var(--blue-pale);color:var(--blue-dark);}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab{
    flex:1;text-align:center;padding:11px 0;border-radius:12px;font-weight:800;font-size:14px;
    background:#fff;border:1px solid var(--border);color:var(--text-soft);
  }
  .tab.active{background:var(--blue);color:#fff;border-color:var(--blue);}

  /* ---------- Notices ---------- */
  .notice-item{border-bottom:1px solid var(--border);padding:14px 2px;}
  .notice-item:last-child{border-bottom:none;}
  .notice-item .top{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .notice-item .title{font-weight:800;font-size:14.5px;}
  .notice-item .body{font-size:13.5px;color:var(--text-soft);}
  .notice-item .time{font-size:11.5px;color:var(--text-faint);margin-top:6px;}
  .imp-tag{background:var(--coral);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;}

  /* ---------- Mission pages ---------- */
  .mission-hero{
    border-radius:22px;padding:26px 20px;color:#fff;text-align:center;margin-bottom:16px;
    background:linear-gradient(135deg,var(--blue) 0%, var(--blue-dark) 100%);
  }
  .mission-hero .emoji{font-size:38px;}
  .mission-hero h2{font-size:19px;margin:8px 0 4px;font-weight:800;}
  .mission-hero p{font-size:13.5px;opacity:0.9;margin:0;}
  .rule-list{list-style:none;margin:0;padding:0;}
  .rule-list li{
    display:flex;gap:10px;align-items:flex-start;padding:9px 0;font-size:14px;
    border-bottom:1px dashed var(--border);
  }
  .rule-list li:last-child{border-bottom:none;}
  .big-btn{
    display:block;width:100%;text-align:center;background:var(--yellow);color:#5A3A00;
    font-weight:800;font-size:16px;padding:18px;border-radius:16px;border:none;margin-top:16px;
  }
  .big-btn:active{filter:brightness(0.95);}
  .pending-note{
    text-align:center;color:var(--text-soft);font-size:13.5px;background:var(--bg);
    border:1px dashed var(--border);border-radius:14px;padding:16px;margin-top:16px;
  }
  .mission-picker{display:flex;flex-direction:column;gap:12px;}
  .mission-picker a.mp-card{
    display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);
    border-radius:16px;padding:16px;
  }
  .mp-card .icon{font-size:28px;}
  .mp-card .t{font-weight:800;font-size:15.5px;}
  .mp-card .s{font-size:12.5px;color:var(--text-soft);}

  /* ---------- Lotte world ---------- */
  .meet-hero{
    background:var(--yellow-pale);border:1px solid #FCE0A6;border-radius:var(--radius);
    padding:18px;text-align:center;margin-bottom:16px;
  }
  .meet-hero .label{font-size:12.5px;color:#8A6300;font-weight:700;}
  .meet-hero .time{font-size:30px;font-weight:900;color:#5A3A00;margin:4px 0;}
  .meet-hero .place{font-size:14px;font-weight:700;color:#5A3A00;}

  /* ---------- Photos ---------- */
  .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .photo-tile{
    aspect-ratio:1/1;border-radius:14px;position:relative;overflow:hidden;
    display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12.5px;font-weight:700;
  }
  .photo-tile .cap{background:rgba(0,0,0,0.35);padding:4px 8px;border-radius:8px;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .modal-box{background:#fff;border-radius:18px;padding:20px;max-width:400px;width:100%;text-align:center;}
  .modal-box.photo-view{padding:12px;}
  .modal-box .ph-big{width:100%;aspect-ratio:4/3;border-radius:12px;margin-bottom:10px;}
  .modal-box h3{margin:6px 0;font-size:16px;}
  .modal-box p{font-size:13.5px;color:var(--text-soft);}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;padding:12px;border-radius:12px;border:none;font-weight:800;font-size:14px;}
  .m-cancel{background:var(--bg);color:var(--text-soft);}
  .m-confirm{background:var(--coral);color:#fff;}
  .m-close{background:var(--bg);color:var(--text-soft);width:100%;margin-top:10px;padding:12px;border-radius:12px;border:none;font-weight:700;}

  /* ---------- Safety ---------- */
  .contact-row{
    display:flex;align-items:center;justify-content:space-between;padding:14px 4px;
    border-bottom:1px solid var(--border);
  }
  .contact-row:last-child{border-bottom:none;}
  .contact-row .label{font-weight:700;font-size:14.5px;}
  .contact-row .num{font-size:12.5px;color:var(--text-soft);margin-top:2px;}
  .call-btn{
    background:var(--green-pale);color:#1E7A4C;font-weight:800;font-size:13px;
    padding:9px 14px;border-radius:12px;border:none;min-height:38px;
  }
  .emergency-btn{
    display:block;width:100%;background:var(--coral);color:#fff;font-weight:800;font-size:16px;
    padding:18px;border-radius:16px;border:none;text-align:center;margin-bottom:16px;
  }

  /* ---------- Meeting points ---------- */
  .meet-item{
    background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;
  }
  .meet-item .top{display:flex;justify-content:space-between;align-items:center;}
  .meet-item .name{font-weight:800;font-size:15px;}
  .meet-item .time{font-size:12.5px;font-weight:800;color:var(--blue);}
  .meet-item .note{font-size:13px;color:var(--text-soft);margin-top:4px;}
  .map-btn{
    display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--blue);
    background:var(--blue-pale);padding:8px 12px;border-radius:10px;
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    background:#fff;border-top:1px solid var(--border);
    display:flex;padding-bottom:env(safe-area-inset-bottom);
    z-index:50;
  }
  .nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:none;border:none;color:var(--text-faint);font-size:10.5px;font-weight:700;min-height:44px;
  }
  .nav-btn .ic{font-size:20px;}
  .nav-btn.active{color:var(--blue);}

  .empty-state{text-align:center;color:var(--text-faint);font-size:13.5px;padding:30px 10px;}
  .offline-hint{
    background:var(--bg);border:1px dashed var(--border);border-radius:12px;padding:10px 12px;
    font-size:12px;color:var(--text-faint);text-align:center;margin-top:10px;
  }
</style>
</head>
<body>

<div id="app"></div>

<nav class="bottom-nav">
  <button class="nav-btn" data-nav="home"><span class="ic">🏠</span>홈</button>
  <button class="nav-btn" data-nav="schedule"><span class="ic">📅</span>일정</button>
  <button class="nav-btn" data-nav="mission"><span class="ic">🏆</span>미션</button>
  <button class="nav-btn" data-nav="notices"><span class="ic">📢</span>공지</button>
  <button class="nav-btn" data-nav="safety"><span class="ic">🚨</span>안전</button>
</nav>

   ========================================================================= */

var TRIP_OVERRIDE_KEY = "happyDaedream_dataOverride_v1";
var TRIP_ADMIN_UNLOCKED_KEY = "happyDaedream_adminUnlocked";

// 관리자 코드 — 학교 상황에 맞게 바꿔서 사용하세요 (간단한 화면 잠금용이며,
// 강력한 보안 장치는 아닙니다. 민감한 개인정보는 이 화면에 넣지 마세요.)
var TRIP_ADMIN_CODE = "0909";

/**
 * 현재 사용할 데이터를 반환합니다.
 * 관리자가 "이 브라우저에 미리보기 저장"을 한 적이 있으면 그 값을,
 * 없으면 data.js의 기본값(TRIP_DATA_DEFAULT)을 사용합니다.
 */
/**
 * localStorage를 사용할 수 없는 환경(샌드박스 미리보기, 시크릿 모드 등)에서도
 * 화면이 멈추지 않도록 감싼 안전한 저장소 함수들.
 * 실패하면 메모리에만 저장되어(새로고침하면 사라짐) 최소한 화면은 정상 작동합니다.
 */
var _tripMemoryStore = {};
function _safeStorageGet(key) {
  try { return window.localStorage.getItem(key); }
  catch (e) { return Object.prototype.hasOwnProperty.call(_tripMemoryStore, key) ? _tripMemoryStore[key] : null; }
}
function _safeStorageSet(key, value) {
  try { window.localStorage.setItem(key, value); }
  catch (e) { _tripMemoryStore[key] = value; }
}
function _safeStorageRemove(key) {
  try { window.localStorage.removeItem(key); }
  catch (e) { delete _tripMemoryStore[key]; }
}
function _safeSessionGet(key) {
  try { return window.sessionStorage.getItem(key); }
  catch (e) { const k = "s:" + key; return Object.prototype.hasOwnProperty.call(_tripMemoryStore, k) ? _tripMemoryStore[k] : null; }
}
function _safeSessionSet(key, value) {
  try { window.sessionStorage.setItem(key, value); }
  catch (e) { _tripMemoryStore["s:" + key] = value; }
}
function _safeSessionRemove(key) {
  try { window.sessionStorage.removeItem(key); }
  catch (e) { delete _tripMemoryStore["s:" + key]; }
}

function loadTripData() {
  try {
    const raw = _safeStorageGet(TRIP_OVERRIDE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.tripDays) return parsed;
    }
  } catch (e) { /* ignore malformed override */ }
  // 깊은 복사로 반환해 원본 기본값이 실수로 변형되지 않도록 함
  return JSON.parse(JSON.stringify(window.TRIP_DATA_DEFAULT));
}

/** 이 브라우저에만 임시로 반영되는 미리보기 저장 */
function saveTripOverride(data) {
  _safeStorageSet(TRIP_OVERRIDE_KEY, JSON.stringify(data));
}

/** 미리보기 초기화 → data.js 기본값으로 되돌림 */
function clearTripOverride() {
  _safeStorageRemove(TRIP_OVERRIDE_KEY);
}

function hasTripOverride() {
  try { return !!_safeStorageGet(TRIP_OVERRIDE_KEY); } catch (e) { return false; }
}

/**
 * 관리자가 편집한 데이터를 data.js 파일 형식의 텍스트로 변환합니다.
 * 이 내용을 다운로드해서 서버의 data.js를 교체하면 모든 학생에게 반영됩니다.
 */
function exportTripDataAsFile(data) {
  const json = JSON.stringify(data, null, 2);
  const content =
`/* =========================================================================
   data.js — 「2026 행복다드림 수학여행」 데이터
   관리자 화면에서 내보낸 파일입니다. (${new Date().toLocaleString("ko-KR")})
   이 파일로 기존 data.js를 교체한 뒤 다시 업로드(배포)하면
   모든 학생 화면에 반영됩니다.
   ========================================================================= */

window.TRIP_DATA_DEFAULT = ${json};
`;
  const blob = new Blob([content], { type: "text/javascript;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "data.js";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

   수정한 뒤 내보내기 하거나, data.js 파일을 직접 편집하세요.

function todayDay() {
  const todayStr = new Date().toISOString().slice(0, 10);
  const match = tripDays.find(d => d.date === todayStr);
  return match ? match.id : tripDays[0].id;
}
function isRealTripDay() {
  const todayStr = new Date().toISOString().slice(0, 10);
  return tripDays.some(d => d.date === todayStr);
}
function nowHM() {
  const n = new Date();
  return n.getHours() * 60 + n.getMinutes();
}
function toMinutes(hm) {
  const [h, m] = hm.split(":").map(Number);
  return h * 60 + m;
}
function itemStatus(item, isToday) {
  if (!isToday) return "upcoming";
  const now = nowHM();
  const start = toMinutes(item.time);
  const end = item.endTime ? toMinutes(item.endTime) : start + 1;
  if (now < start) return "upcoming";
  if (now >= start && now < end) return "now";
  return "done";
}
function findNextOrCurrent(dayId, isToday) {
  const list = schedules[dayId] || [];
  if (!isToday) return list[0] || null;
  const now = nowHM();
  for (const it of list) {
    const start = toMinutes(it.time);
    const end = it.endTime ? toMinutes(it.endTime) : start + 1;
    if (now < end) return it;
  }
  return list[list.length - 1] || null;
}

function navigate(route) {

function currentRoute() {

      <div class="row">
        <div>
          <div class="time">${it.time}${it.endTime ? " ~ " + it.endTime : ""}</div>
          <div class="title">${it.title}</div>
          <div class="meta">📍 ${it.place} ${it.transport && it.transport !== "-" ? "· 🚌 " + it.transport : ""}</div>
          ${it.note ? `<div class="note">${it.note}</div>` : ""}
        </div>
        ${badge}
      </div>
    </div>`;
  }).join("");

  return `
  <div class="view">
    ${!real ? `<div class="offline-hint">오늘은 수학여행 기간이 아니에요. ${day.label} 일정을 미리 보여드려요.</div>` : ""}
    <div class="section-title">📅 ${day.label} · ${day.title}</div>
    <div class="card">
      <div class="timeline">${items || `<div class="empty-state">등록된 일정이 없어요.</div>`}</div>
    </div>
    ${SCHEDULE_NOTE ? `<div class="offline-hint">${SCHEDULE_NOTE}</div>` : ""}
  </div>`;
}

/* ---------- SCHEDULE (tabs) ---------- */
function renderSchedule() {
  if (!state.scheduleTab) state.scheduleTab = todayDay();
  const tabs = tripDays.map(d => `
    <button class="tab ${d.id === state.scheduleTab ? "active" : ""}" data-day="${d.id}">${d.label}</button>
  `).join("");

  const day = tripDays.find(d => d.id === state.scheduleTab);
  const list = schedules[state.scheduleTab] || [];
  const rows = list.map(it => `
    <div class="t-item">
      <div class="row">
        <div>
          <div class="time">${it.time}${it.endTime ? " ~ " + it.endTime : ""}</div>
          <div class="title">${it.title}</div>
          <div class="meta">📍 ${it.place} ${it.transport && it.transport !== "-" ? "· 🚌 " + it.transport : ""}</div>
          ${it.note ? `<div class="note">${it.note}</div>` : ""}
        </div>
      </div>
    </div>
  `).join("");

  return `
  <div class="view">
    <div class="tabs">${tabs}</div>
    <div class="section-title">${day.title}</div>
    <div class="card"><div class="timeline">${rows || `<div class="empty-state">등록된 일정이 없어요.</div>`}</div></div>
    ${SCHEDULE_NOTE ? `<div class="offline-hint">${SCHEDULE_NOTE}</div>` : ""}
  </div>`;
}

/* ---------- NOTICES ---------- */
function renderNotices() {
  const sorted = [...notices].sort((a, b) => (a.time < b.time ? 1 : -1));
  const items = sorted.map(n => `
    <div class="notice-item">
      <div class="top">${n.important ? `<span class="imp-tag">중요</span>` : ""}<span class="title">${n.title}</span></div>
      <div class="body">${n.body}</div>
      <div class="time">${n.time}</div>
    </div>
  `).join("");
  return `<div class="view"><div class="card">${items || `<div class="empty-state">등록된 공지가 없어요.</div>`}</div></div>`;
}

/* ---------- MISSION ---------- */
function renderMissionPicker() {
  return `
  <div class="view">
    <div class="section-title">🏆 미션을 선택하세요</div>
    <div class="mission-picker">
      <a class="mp-card" href="#mission/museum">
        <div class="icon">🏛️</div>
        <div><div class="t">국립중앙박물관 미션</div><div class="s">전시물을 찾아 문제를 해결해요</div></div>
      </a>
      <a class="mp-card" href="#mission/gyeongbokgung">
        <div class="icon">🏯</div>
        <div><div class="t">경복궁 미션</div><div class="s">조선 왕실의 흔적을 찾아봐요</div></div>
      </a>
    </div>
  </div>`;
}

function renderMission(key) {

    },
    gyeongbokgung: {
      emoji: "🏯", name: "경복궁",
      desc: "조선 왕실의 흔적을 찾아 미션을 해결해 보세요!",
      rules: ["조원과 함께 이동하세요", "문화재를 소중히 다뤄주세요", "뛰어다니지 않기", "정해진 관람 경로를 따라가기"]

  }[key];

  return `

    </div>

/* ---------- LOTTE WORLD ---------- */
function renderLotteWorld() {
  const rules = lotteWorld.safetyRules.map(r => `<li>🎢 ${r}</li>`).join("");
  return `
  <div class="view">
    <div class="meet-hero">
      <div class="label">다음 집결시간</div>
      <div class="time">${lotteWorld.meetingTime}</div>

    </div>

      </div>
      <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;">
        <span>자유시간 종료</span><span>${lotteWorld.freeTimeEnd}</span>
      </div>

/* ---------- PHOTOS ---------- */
const swatches = ["#2B6CB8", "#3FA873", "#FFB100", "#E8543C", "#6B7280", "#1E4D80"];
function renderPhotos() {
  const sections = tripDays.map((d, i) => {
    const list = photos[d.id] || [];
    const tiles = list.map((p, idx) => {
      const color = swatches[(i + idx) % swatches.length];
      const bg = p.url ? `background-image:url('${p.url}');background-size:cover;background-position:center;` : `background:${color};`;
      return `<div class="photo-tile" style="${bg}" data-place="${p.place}" data-url="${p.url || ""}">
        <span class="cap">${p.place}</span>
      </div>`;
    }).join("");
    return `
    <div class="section-title">DAY ${d.id} · ${d.label}</div>
    <div class="photo-grid">${tiles || `<div class="empty-state">아직 등록된 사진이 없어요.</div>`}</div>`;
  }).join("");
  return `<div class="view">${sections}</div>`;
}

/* ---------- SAFETY ---------- */
function renderSafety() {
  const contacts = emergencyContacts.map(c => `
    <div class="contact-row">
      <div>
        <div class="label">${c.label}</div>
        <div class="num">${c.phone}</div>
      </div>
      <a href="tel:${c.phone}"><button class="call-btn">📞 전화</button></a>

  `).join("");
  const rules = safetyRules.map(r => `<li>🙋 ${r}</li>`).join("");
  const points = meetingPoints[todayDay()] || [];

  return `
  <div class="view">
    <button class="emergency-btn" id="emergencyBtn">🚨 긴급 상황 알리기</button>

    <div class="section-title">👩‍🏫 인솔교사 · 비상연락</div>
    <div class="card">${contacts}</div>

    <div class="section-title">📍 현재 집결장소</div>
    <div class="card">${cur ? `<b>${cur.name}</b> · ${cur.time} 집결<br><span style="color:var(--text-soft);font-size:13px;">${cur.note}</span>` : "안내 예정"}</div>

  </div>

  <div id="emergencyModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div style="font-size:34px;">🚨</div>
      <h3>긴급 상황이 맞나요?</h3>
      <p>인솔교사에게 즉시 연결됩니다.<br>정말 긴급한 상황일 때만 눌러주세요.</p>
      <div class="modal-actions">
        <button class="m-cancel" id="emergencyCancel">취소</button>
        <a href="tel:${emergencyContacts[0] ? emergencyContacts[0].phone : ""}" style="flex:1;">
          <button class="m-confirm" style="width:100%;">네, 전화 걸기</button>
        </a>
      </div>
    </div>
  </div>`;
}

/* ---------- MEETING POINTS ---------- */
function renderMeetingPoints() {
  const sections = tripDays.map(d => {
    const list = meetingPoints[d.id] || [];
    const items = list.map(p => `
      <div class="meet-item">
        <div class="top">
          <span class="name">📍 ${p.name}</span>
          <span class="time">⏰ ${p.time}</span>
        </div>
        ${p.note ? `<div class="note">${p.note}</div>` : ""}
        ${p.mapUrl ? `<a class="map-btn" href="${p.mapUrl}" target="_blank" rel="noopener">🗺️ 지도 열기</a>` : `<span class="map-btn" style="opacity:0.5;">🗺️ 지도 준비 중</span>`}
      </div>
    `).join("");
    return `<div class="section-title">${d.label}</div>${items}`;
  }).join("");
  return `<div class="view">${sections}</div>`;
}

/* =========================================================================
   VIEW EVENT BINDINGS
   ========================================================================= */
function bindViewEvents(main, sub) {
  if (main === "schedule") {
    document.querySelectorAll(".tab").forEach(t => {
      t.addEventListener("click", () => {
        state.scheduleTab = Number(t.dataset.day);
        render();
      });
    });
  }
  if (main === "photos") {
    document.querySelectorAll(".photo-tile").forEach(tile => {
      tile.addEventListener("click", () => openPhotoModal(tile.dataset.place, tile.dataset.url));
    });
  }
  if (main === "safety") {
    const btn = document.getElementById("emergencyBtn");
    const modal = document.getElementById("emergencyModal");
    const cancel = document.getElementById("emergencyCancel");
    if (btn && modal) {
      btn.addEventListener("click", () => modal.style.display = "flex");
      cancel.addEventListener("click", () => modal.style.display = "none");
      modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
    }
  }
}

function openPhotoModal(place, url) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box photo-view">
      <div class="ph-big" style="${url ? `background-image:url('${url}');background-size:cover;background-position:center;` : `background:var(--blue-pale);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-soft);`}">
        ${url ? "" : "사진 준비 중이에요"}
      </div>
      <h3>${place}</h3>
      <button class="m-close">닫기</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector(".m-close").addEventListener("click", () => overlay.remove());
}

/* =========================================================================
   SERVICE WORKER (PWA)
   ========================================================================= */
function registerSW() {
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
