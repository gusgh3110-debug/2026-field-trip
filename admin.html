<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>관리자 · 2026 행복다드림 수학여행</title>
<meta name="theme-color" content="#1E4D80">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    --blue:#2B6CB8; --blue-dark:#1E4D80; --blue-pale:#EAF2FC;
    --yellow:#FFB100; --yellow-pale:#FFF4DC;
    --coral:#E8543C; --coral-pale:#FDE9E5;
    --green:#3FA873; --green-pale:#E6F6EE;
    --bg:#F5F8FC; --card:#FFFFFF;
    --text:#1F2937; --text-soft:#697386; --text-faint:#9AA5B4;
    --border:#E4EAF2; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
  }
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}

  /* ---- Gate ---- */
  .gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(135deg,var(--blue) 0%, var(--blue-dark) 100%);
  }
  .gate-box{background:#fff;border-radius:20px;padding:32px 24px;max-width:360px;width:100%;text-align:center;}
  .gate-box .emoji{font-size:36px;}
  .gate-box h2{font-size:18px;margin:10px 0 6px;}
  .gate-box p{font-size:13px;color:var(--text-soft);margin-bottom:18px;}
  .gate-box input{
    width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--border);
    font-size:16px;text-align:center;letter-spacing:0.1em;margin-bottom:12px;
  }
  .gate-box button{
    width:100%;padding:14px;border-radius:12px;border:none;background:var(--blue);
    color:#fff;font-weight:800;font-size:15px;
  }
  .gate-err{color:var(--coral);font-size:12.5px;margin-bottom:10px;min-height:16px;}

  /* ---- Top bar ---- */
  .topbar{
    background:linear-gradient(135deg,var(--blue) 0%, var(--blue-dark) 100%);
    color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 16px;
    border-radius:0 0 22px 22px;
  }
  .topbar .eyebrow{font-size:12.5px;opacity:0.85;font-weight:600;}
  .topbar h1{font-size:19px;margin:4px 0 10px;font-weight:800;}
  .topbar .links{display:flex;gap:10px;flex-wrap:wrap;}
  .topbar .links a, .topbar .links button{
    font-size:12px;color:#fff;background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.3);padding:7px 12px;border-radius:999px;font-weight:700;
  }

  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 8px;}
  .notice-box{
    background:var(--yellow-pale);border:1px solid #FCE0A6;border-radius:14px;
    padding:12px 14px;font-size:12.5px;color:#7A5600;margin-bottom:14px;
  }

  /* ---- Tab bar ---- */
  .tabbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
  .tabbar::-webkit-scrollbar{display:none;}
  .tabbtn{
    flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--border);
    background:#fff;color:var(--text-soft);font-weight:700;font-size:13px;white-space:nowrap;
  }
  .tabbtn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

  .subtabs{display:flex;gap:8px;margin-bottom:12px;}
  .subtab{flex:1;text-align:center;padding:9px 0;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--text-soft);font-weight:700;font-size:13px;}
  .subtab.active{background:var(--blue-dark);color:#fff;border-color:var(--blue-dark);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
  .section-title{font-size:14px;font-weight:800;margin:16px 2px 8px;}
  .section-title:first-child{margin-top:0;}

  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-soft);margin-bottom:4px;}
  .field input[type=text], .field input[type=date], .field input[type=tel], .field input[type=url], .field textarea{
    width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);font-size:14px;color:var(--text);
    background:#fff;
  }
  .field textarea{resize:vertical;min-height:44px;}
  .field-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .check-row{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin-top:2px;}

  .item-card{border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px;background:#FBFCFE;}
  .item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .item-head .idx{font-size:11.5px;font-weight:800;color:var(--text-faint);}
  .item-actions{display:flex;gap:6px;}
  .icon-btn{
    background:#fff;border:1px solid var(--border);border-radius:8px;width:30px;height:30px;
    font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--text-soft);
  }
  .icon-btn.danger{color:var(--coral);border-color:#F5C6BC;}

  .add-btn{
    width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--blue);background:var(--blue-pale);
    color:var(--blue-dark);font-weight:800;font-size:13.5px;margin-top:4px;
  }
  .str-item{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .str-item input{flex:1;}

  /* ---- Sticky action bar ---- */
  .sticky-actions{
    position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:60;
  }
  .sticky-actions button{
    flex:1;padding:13px 8px;border-radius:12px;border:none;font-weight:800;font-size:12.5px;
  }
  .btn-preview{background:var(--green);color:#fff;}
  .btn-export{background:var(--blue);color:#fff;}
  .btn-reset{background:var(--bg);color:var(--text-soft);border:1px solid var(--border) !important;}

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:#1F2937;color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;
    opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:80;white-space:nowrap;
  }
  .toast.show{opacity:1;}
</style>
</head>

<div id="gateScreen" class="gate" style="display:none;">

/* =========================================================================
   common.js — 학생용/관리자용 화면이 함께 쓰는 데이터 로딩·저장 로직
   ========================================================================= */

var TRIP_OVERRIDE_KEY = "happyDaedream_dataOverride_v1";
var TRIP_ADMIN_UNLOCKED_KEY = "happyDaedream_adminUnlocked";

// 관리자 코드 — 학교 상황에 맞게 바꿔서 사용하세요 (간단한 화면 잠금용이며,
// 강력한 보안 장치는 아닙니다. 민감한 개인정보는 이 화면에 넣지 마세요.)
var TRIP_ADMIN_CODE = "0909";

/**
 * 현재 사용할 데이터를 반환합니다.
 * 관리자가 "이 브라우저에 미리보기 저장"을 한 적이 있으면 그 값을,
 * 없으면 data.js의 기본값(TRIP_DATA_DEFAULT)을 사용합니다.
 */
/**
 * localStorage를 사용할 수 없는 환경(샌드박스 미리보기, 시크릿 모드 등)에서도
 * 화면이 멈추지 않도록 감싼 안전한 저장소 함수들.
 * 실패하면 메모리에만 저장되어(새로고침하면 사라짐) 최소한 화면은 정상 작동합니다.
 */
var _tripMemoryStore = {};
function _safeStorageGet(key) {
  try { return window.localStorage.getItem(key); }
  catch (e) { return Object.prototype.hasOwnProperty.call(_tripMemoryStore, key) ? _tripMemoryStore[key] : null; }
}
function _safeStorageSet(key, value) {
  try { window.localStorage.setItem(key, value); }
  catch (e) { _tripMemoryStore[key] = value; }
}
function _safeStorageRemove(key) {
  try { window.localStorage.removeItem(key); }
  catch (e) { delete _tripMemoryStore[key]; }
}
function _safeSessionGet(key) {
  try { return window.sessionStorage.getItem(key); }
  catch (e) { const k = "s:" + key; return Object.prototype.hasOwnProperty.call(_tripMemoryStore, k) ? _tripMemoryStore[k] : null; }
}
function _safeSessionSet(key, value) {
  try { window.sessionStorage.setItem(key, value); }
  catch (e) { _tripMemoryStore["s:" + key] = value; }
}
function _safeSessionRemove(key) {
  try { window.sessionStorage.removeItem(key); }
  catch (e) { delete _tripMemoryStore["s:" + key]; }
}

function loadTripData() {
  try {
    const raw = _safeStorageGet(TRIP_OVERRIDE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.tripDays) return parsed;
    }
  } catch (e) { /* ignore malformed override */ }
  // 깊은 복사로 반환해 원본 기본값이 실수로 변형되지 않도록 함
  return JSON.parse(JSON.stringify(window.TRIP_DATA_DEFAULT));
}

/** 이 브라우저에만 임시로 반영되는 미리보기 저장 */
function saveTripOverride(data) {
  _safeStorageSet(TRIP_OVERRIDE_KEY, JSON.stringify(data));
}

/** 미리보기 초기화 → data.js 기본값으로 되돌림 */
function clearTripOverride() {
  _safeStorageRemove(TRIP_OVERRIDE_KEY);
}

function hasTripOverride() {
  try { return !!_safeStorageGet(TRIP_OVERRIDE_KEY); } catch (e) { return false; }
}

/**
 * 관리자가 편집한 데이터를 data.js 파일 형식의 텍스트로 변환합니다.
 * 이 내용을 다운로드해서 서버의 data.js를 교체하면 모든 학생에게 반영됩니다.
 */
function exportTripDataAsFile(data) {
  const json = JSON.stringify(data, null, 2);
  const content =
`/* =========================================================================
   data.js — 「2026 행복다드림 수학여행」 데이터
   관리자 화면에서 내보낸 파일입니다. (${new Date().toLocaleString("ko-KR")})
   이 파일로 기존 data.js를 교체한 뒤 다시 업로드(배포)하면
   모든 학생 화면에 반영됩니다.
   ========================================================================= */

window.TRIP_DATA_DEFAULT = ${json};
`;
  const blob = new Blob([content], { type: "text/javascript;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "data.js";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

</script>

  bind("lwEntry", "entryTime"); bind("lwFreeEnd", "freeTimeEnd"); bind("lwMeetTime", "meetingTime");
  bind("lwMeetPlace", "meetingPlace"); bind("lwLost", "lostAndFound");
  renderStrList(document.getElementById("lwSafetyList"), l.safetyRules, "예: 안전벨트 반드시 착용하기");
  document.getElementById("lwAddSafety").addEventListener("click", () => { l.safetyRules.push(""); renderLotteSection(); });
}

function renderPhotosList() {

    <div class="item-card" data-i="${i}">
      <div class="item-head"><span class="idx">#${i + 1}</span><div class="item-actions"><button class="icon-btn danger" data-act="del">✕</button></div></div>

/* ---------------- 여행일차 ---------------- */
function renderDaysSection() {
  const el = document.getElementById("sectionContent");
  el.innerHTML = `
    <div class="section-title">기본 정보</div>
    <div class="card">
      <div class="field"><label>학교명</label><input type="text" id="schoolNameInput" value="${escAttr(adminData.schoolName)}"></div>
    </div>
    <div class="section-title">1~3일차 기본 정보</div>
    <div id="daysList"></div>
  `;
  document.getElementById("schoolNameInput").addEventListener("input", (e) => { adminData.schoolName = e.target.value; });
  renderDaysList();
}
function renderDaysList() {
  const list = adminData.tripDays;
  const box = document.createElement("div");
  box.id = "daysList";
  box.innerHTML = list.map((d, i) => `
    <div class="item-card" data-i="${i}">
      <div class="item-head"><span class="idx">${d.label}</span></div>
      <div class="field-row2">
        <div class="field"><label>일차 이름</label><input type="text" data-k="label" value="${escAttr(d.label)}"></div>
        <div class="field"><label>날짜</label><input type="date" data-k="date" value="${escAttr(d.date)}"></div>
      </div>
      <div class="field"><label>일정 요약 (일정 탭 제목으로 표시)</label><input type="text" data-k="title" value="${escAttr(d.title)}"></div>
    </div>
  `).join("");
  const old = document.getElementById("daysList");
  old.replaceWith(box);
  box.querySelectorAll(".item-card").forEach(card => {
    const i = Number(card.dataset.i);
    card.querySelectorAll("[data-k]").forEach(inp => {
      inp.addEventListener("input", () => { list[i][inp.dataset.k] = inp.value; });
    });
  });
}

/* ---------------- 공용 헬퍼 ---------------- */
function bindListCard(box, list, rerenderFn) {
  box.querySelectorAll(".item-card").forEach(card => {
    const i = Number(card.dataset.i);
    card.querySelectorAll("[data-k]").forEach(inp => {
      const evt = inp.type === "checkbox" ? "change" : "input";
      inp.addEventListener(evt, () => { list[i][inp.dataset.k] = inp.type === "checkbox" ? inp.checked : inp.value; });
    });
    card.querySelectorAll("[data-act]").forEach(btn => {
      btn.addEventListener("click", () => {
        const act = btn.dataset.act;
        if (act === "del") { if (confirm("삭제할까요?")) { list.splice(i, 1); rerenderFn(); } }
        if (act === "up" && i > 0) { [list[i - 1], list[i]] = [list[i], list[i - 1]]; rerenderFn(); }
        if (act === "down" && i < list.length - 1) { [list[i + 1], list[i]] = [list[i], list[i + 1]]; rerenderFn(); }
      });
    });
  });
}
function renderStrList(container, arr, placeholder) {
  container.innerHTML = arr.map((v, i) => `
    <div class="str-item" data-i="${i}">
      <input type="text" value="${escAttr(v)}" placeholder="${placeholder || ""}">
      <button class="icon-btn danger" data-act="del">✕</button>
    </div>
  `).join("") || `<div class="notice-box">등록된 항목이 없어요.</div>`;
  container.querySelectorAll(".str-item").forEach(row => {
    const i = Number(row.dataset.i);
    row.querySelector("input").addEventListener("input", (e) => { arr[i] = e.target.value; });
    row.querySelector("[data-act]").addEventListener("click", () => { arr.splice(i, 1); renderStrList(container, arr, placeholder); });
  });
}
function esc(s) { return (s || "").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escAttr(s) { return (s || "").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function nowStr() {
  const n = new Date();
  const p = (x) => String(x).padStart(2, "0");
  return `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}`;
}

initGate();
